[package]
name = "mutsukitube-plugin-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
