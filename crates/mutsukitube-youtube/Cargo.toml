[package]
name = "mutsukitube-youtube"
version = "0.1.0"
edition = "2024"

[dependencies]
mutsukitube-core = { path = "../mutsukitube-core" }
  
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["process", "full"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }