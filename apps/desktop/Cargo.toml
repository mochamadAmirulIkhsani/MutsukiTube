[package]
name = "mutsukitube-desktop"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
mutsukitube-core = {path = "../../crates/mutsukitube-core"}

mutsukitube-youtube = {path = "../../crates/mutsukitube-youtube"}

mutsukitube-player = {path = "../../crates/mutsukitube-player"}

slint = {version = "1.18.1", features = [ "image-default-formats"]}

tokio = {version = "1", features = [ "rt-multi-thread", "fs"]}

reqwest = {version = "0.12", default-features = false, features = [ "rustls-tls" ]}
futures = "0.3"
dirs = "6"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
slint-build = "1"