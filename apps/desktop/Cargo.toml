
[package]
name = "mutsukitube-desktop"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
mutsukitube-core = { path = "../../crates/mutsukitube-core" }
mutsukitube-youtube = { path = "../../crates/mutsukitube-youtube" }
mutsukitube-player = { path = "../../crates/mutsukitube-player" }
mutsukitube-storage = { path = "../../crates/mutsukitube-storage" }
mutsukitube-embedded-player = { path = "../../crates/mutsukitube-embedded-player" }

slint = { version = "1.18.1", features = [
    "image-default-formats",
    "raw-window-handle-06",
] }

raw-window-handle = "0.6"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "fs",
] }

reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }

futures = "0.3"
dirs = "6"
sha2 = "0.10"
hex = "0.4"

rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
slint-build = "1"
